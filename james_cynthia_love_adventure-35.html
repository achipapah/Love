<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ff2d8b">
<title>James & Cynthia — Our Love Story ❤️</title>
<style>
:root{--pink:#ff2d8b;--coral:#ff6b6b;--yellow:#ffd83d;--blue:#1677ff;--purple:#7b2ff7;--ink:#10204a;--cream:#fff9ed;--green:#20c997}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:linear-gradient(145deg,#fff2b8 0%,#ffd6e8 35%,#c7e9ff 68%,#e2d2ff 100%);overflow-x:hidden}
button,input{font:inherit}button{cursor:pointer;border:0} .wrap{max-width:1180px;margin:auto;padding:18px}
.hero{position:relative;overflow:hidden;border-radius:30px;background:linear-gradient(120deg,#fff 0%,#ffe2f0 43%,#d8f4ff 100%);box-shadow:0 18px 55px #59316d25;padding:26px;margin-top:18px}
.hero:before,.hero:after{content:"✦ ♥ ✦";position:absolute;font-size:30px;color:#ff4e9b;opacity:.35;animation:float 5s ease-in-out infinite}.hero:before{top:14px;left:20px}.hero:after{bottom:20px;right:22px;animation-delay:1s}
@keyframes float{50%{transform:translateY(-12px) rotate(12deg)}}
.hero-grid{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:18px;align-items:center}.hero-photo{width:100%;height:300px;object-fit:cover;border:6px solid white;border-radius:24px;box-shadow:0 12px 25px #4e285b22}.hero-photo.couple{object-position:center 35%}.hero-title{text-align:center}.eyebrow{display:inline-block;background:#fff;border:1px solid #ffd1e5;border-radius:99px;padding:8px 13px;font-weight:800;color:#d91f75;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}.hero h1{font-family:Georgia,serif;font-size:clamp(2.3rem,5.4vw,4.8rem);line-height:.98;margin:16px 0 10px;color:#152b65}.hero h1 span{color:var(--pink)}.subtitle{font-size:1.08rem;line-height:1.6;margin:0 auto;max-width:390px}.tiny-note{font-family:Georgia,serif;font-style:italic;color:#9d2665;margin-top:14px}
.pill{display:inline-flex;gap:8px;align-items:center;background:#fff;padding:9px 14px;border-radius:999px;box-shadow:0 4px 15px #53336c12;font-weight:750;font-size:.9rem}
.section{margin-top:24px;border-radius:26px;padding:24px;background:#ffffffdf;box-shadow:0 14px 38px #4b276b16;border:1px solid #ffffffb5}
.section h2{font-size:clamp(1.45rem,3vw,2.1rem);margin:0 0 8px;color:#172b66}.section-intro{margin:0 0 18px;color:#4b5a7a;line-height:1.6}
.gate{background:linear-gradient(135deg,#101c48,#4a207f);color:white;display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:center}.gate h2{color:white}.gate .section-intro{color:#e8e5ff}.gate-art{font-size:6rem;text-align:center;filter:drop-shadow(0 10px 10px #0004)}.gate input{width:100%;border:2px solid #e7d9ff;border-radius:14px;padding:14px 15px;background:#fff;color:#18234b;outline:none}.gate input:focus{border-color:#ff4e9b}.btn{padding:12px 18px;border-radius:999px;font-weight:850;color:white;background:linear-gradient(100deg,var(--pink),#ff704d);box-shadow:0 7px 16px #ff2d8b32;transition:.18s transform}.btn:hover{transform:translateY(-2px)}.btn.yellow{background:linear-gradient(100deg,#ffe94a,#ffb72e);color:#34234d}.btn.blue{background:linear-gradient(100deg,#1677ff,#6b45ff)}.btn.green{background:linear-gradient(100deg,#00b894,#20c997)}.btn.secondary{background:#f3e9ff;color:#522c89;box-shadow:none}.gate .btn{width:100%;margin-top:10px}.feedback{min-height:24px;font-weight:700;margin-top:9px;color:#ffb4d8}.hidden{display:none!important}
.love-note{background:linear-gradient(135deg,#fffdf3,#fff0dc);border:2px dashed #ffc36b;position:relative}.love-note:after{content:"💌";position:absolute;right:22px;top:15px;font-size:2rem}.note-text{font-family:Georgia,serif;font-size:1.1rem;line-height:1.85;white-space:pre-line;max-width:850px}
.games-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.game-card{border-radius:22px;padding:17px;background:white;border:2px solid #f1e5ff;box-shadow:0 8px 18px #2e1b4d0c;min-width:0}.game-card:nth-child(3n+1){background:linear-gradient(150deg,#fff,#ffe6f1)}.game-card:nth-child(3n+2){background:linear-gradient(150deg,#fff,#e6f5ff)}.game-card:nth-child(3n){background:linear-gradient(150deg,#fff,#fff4c9)}.game-icon{font-size:2.1rem}.game-card h3{margin:8px 0 6px}.game-card p{font-size:.93rem;line-height:1.5;color:#53617e;min-height:42px}.game-card .btn{width:100%;font-size:.9rem;padding:10px}
.game-panel{margin-top:16px;padding:20px;border-radius:20px;background:#f8f5ff;border:2px solid #e7d8ff}.game-panel h3{margin-top:0}.center{text-align:center}.wheel{width:190px;height:190px;border-radius:50%;margin:16px auto;background:conic-gradient(#ff4081 0 45deg,#ffd83d 45deg 90deg,#21c8a7 90deg 135deg,#4d9cff 135deg 180deg,#a16cff 180deg 225deg,#ff9e45 225deg 270deg,#ff6fae 270deg 315deg,#6de0ff 315deg 360deg);border:8px solid white;box-shadow:0 8px 20px #4e2d6530;display:grid;place-items:center;font-size:3rem;transition:transform 2.3s cubic-bezier(.12,.65,.18,1)}.wheel-wrap{position:relative}.wheel-wrap:before{content:"▼";position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:2;color:#14204b;font-size:1.5rem}
.quiz-question{font-weight:850;font-size:1.15rem;margin-bottom:13px}.answer-row{display:flex;gap:10px;flex-wrap:wrap}.answer-row .btn{flex:1;min-width:100px}.result{margin-top:12px;font-weight:800;color:#a51e6a;min-height:24px}
.yesno-list{display:grid;gap:12px}.yesno-item{background:white;border-radius:16px;padding:14px;border:1px solid #f1d7e6}.yesno-item strong{display:block;margin-bottom:9px}.yesno-item .btn{margin-right:7px;padding:8px 15px}.yesno-item .btn.no{background:#eaf1ff;color:#2354a7;box-shadow:none}.yesno-item .answer{margin-top:8px;color:#a51e6a;font-weight:700;min-height:20px}
.memory-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;max-width:520px;margin:14px auto}.memory-card{aspect-ratio:1;border-radius:14px;background:linear-gradient(140deg,#ff4b9b,#7d42ef);color:white;font-size:1.8rem;font-weight:900;box-shadow:0 5px 12px #4b24742b}.memory-card.revealed,.memory-card.matched{background:white;color:#172b66;border:2px solid #ffc1df}.memory-card.matched{background:#d9fff0;border-color:#71dcb7}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:15px}.gallery figure{margin:0;background:#fff;border-radius:20px;padding:10px;box-shadow:0 8px 18px #34204a15;transform:rotate(-1deg)}.gallery figure:nth-child(2){transform:rotate(1deg)}.gallery img{width:100%;height:350px;object-fit:cover;border-radius:14px}.gallery figcaption{text-align:center;padding:10px 4px;font-family:Georgia,serif;font-weight:700}
.runner-area{background:linear-gradient(#a6e7ff,#d9f6ff 44%,#8dd98a 44%,#43ae78);border-radius:20px;overflow:hidden;padding:12px;position:relative}.runner-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:800;margin-bottom:10px}.runner-canvas{display:block;width:100%;height:300px;border-radius:14px;background:linear-gradient(#b4ecff 0 55%,#79c97b 55% 100%);touch-action:manipulation}.runner-controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}.runner-controls button{min-width:100px}.runner-msg{font-weight:800;text-align:center;min-height:25px;margin-top:10px}
.footer{text-align:center;padding:28px 12px;color:#fff;background:linear-gradient(100deg,#12204b,#56257c,#e82b84);border-radius:24px;margin:24px 0 12px}.footer strong{font-family:Georgia,serif;font-size:1.8rem}.footer p{margin:8px 0}.small{font-size:.82rem;color:#66708b}.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#15224f;color:white;padding:12px 18px;border-radius:999px;box-shadow:0 6px 25px #0003;z-index:10;max-width:90vw;text-align:center}
@media(max-width:760px){.wrap{padding:10px}.hero{padding:14px;border-radius:22px}.hero-grid{grid-template-columns:1fr 1fr;gap:10px}.hero-title{grid-column:1/-1;grid-row:1}.hero-photo{height:220px}.hero-photo:first-child{object-position:center}.hero-photo.couple{object-position:center 25%}.gate{grid-template-columns:1fr}.gate-art{font-size:4rem;order:-1}.section{padding:17px;margin-top:15px}.games-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.game-card{padding:13px}.gallery img{height:260px}.runner-canvas{height:260px}}
@media(max-width:420px){.games-grid{grid-template-columns:1fr 1fr}.game-card p{min-height:60px}.gallery{grid-template-columns:1fr}.gallery img{height:360px}.memory-grid{gap:6px}.memory-card{border-radius:10px;font-size:1.5rem}.hero-photo{height:180px}}
</style>
</head>
